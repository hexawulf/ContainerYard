# Dependabot version updates (security updates are enabled in the repo settings).
# Weekly, grouped so each ecosystem opens at most one routine PR per week; CI runs on each PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    # Let fresh releases age a few days first (compromised versions are usually
    # pulled within hours). Security updates are not delayed by this.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      prisma:
        patterns: [prisma, "@prisma/*"]
    ignore:
      # Majors that need a planned migration, not a bump: React 19 (types must
      # match the runtime), Prisma 7 (driver adapter + new client generator) and
      # Express 5 (route syntax; @types/express must match the express runtime),
      # Tailwind 4 (CSS-first config, plugin swap; needs visual QA).
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: prisma
        update-types: [version-update:semver-major]
      - dependency-name: "@prisma/*"
        update-types: [version-update:semver-major]
      - dependency-name: express
        update-types: [version-update:semver-major]
      - dependency-name: "@types/express"
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    ignore:
      # stay on Node 22 LTS until a deliberate major upgrade
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Taipei
    groups:
      actions:
        patterns: ["*"]
