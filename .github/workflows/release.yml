# Release: on a pushed tag vX.Y.Z (or by hand for an existing tag), run CI on
# that tag, then build linux/amd64 + linux/arm64 and push
# 0xwulf/containeryard:X.Y.Z, :X.Y and :latest with SBOM and provenance
# attestations. Only runs in hexawulf/ContainerYard; Docker Hub credentials are
# used in the publish job alone, after the tests passed.
# Weekly refresh: every Monday the latest GitHub Release is rebuilt without the
# build cache, so the runtime stage's apt-get upgrade picks up Debian security
# fixes. Same version tags are re-pushed; running hosts update on next deploy.
# Trivy gate: before Docker Hub is touched, an amd64 copy of the image is built
# and scanned. A fixable CRITICAL fails the release; fixable HIGH and all
# findings go to the job summary and the Security tab (SARIF). The weekly
# refresh only reports, so a new CVE never blocks the rebuild that fixes it.
# Accepted findings go in .trivyignore with a reason and an expiry.
name: Release

on:
  push:
    tags: ['v*.*.*']
  schedule:
    - cron: '17 3 * * 1'   # Monday 03:17 UTC: rebuild the latest release
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v4.0.0
        required: true
        type: string
      latest:
        description: Also move :latest (untick when republishing an older version)
        type: boolean
        default: true
      no_cache:
        description: Rebuild without the build cache (picks up Debian updates)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event_name == 'schedule' && 'weekly-refresh' || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check the tag
    if: github.repository == 'hexawulf/ContainerYard'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - name: Validate the tag name
        id: check
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = schedule ]; then
            TAG=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
            echo "weekly refresh of the latest release: $TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          echo "ref=refs/tags/$TAG" >>"$GITHUB_OUTPUT"

      - name: Tagged commit is on main
        # Only reviewed code may be published: the tag must point at a commit
        # that main contains (compare status "behind" or "identical").
        env:
          TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          status=$(gh api "repos/$REPO/compare/main...$sha" --jq .status)
          if [ "$status" != behind ] && [ "$status" != identical ]; then
            echo "::error::$TAG ($sha) is not on main (compare status: $status)"
            exit 1
          fi
          echo "$TAG ($sha) is on main"

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.check.outputs.ref }}
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Tag matches package.json version
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          pkg=$(jq -r .version package.json)
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::package.json version is $pkg, tag is $TAG"
            exit 1
          fi

  test:
    name: CI on the tag
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag.outputs.ref }}

  publish:
    name: Build and push (amd64, arm64)
    if: github.repository == 'hexawulf/ContainerYard'
    needs: [tag, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # Trivy SARIF -> Security tab
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.ref }}
          persist-credentials: false

      # SOURCE_DATE_EPOCH is the tagged commit's committer date so two builds of
      # one tag produce identical assets and deterministic build dates.
      - name: Commit of the tag
        id: rev
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "epoch=$(git log -1 --format=%ct)"
            echo "created=$(git log -1 --format=%cI)"
          } >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: 0xwulf/containeryard
          # pre-releases (vX.Y.Z-rc.1) get only their own tag, never :X.Y or :latest
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
          flavor: |
            latest=${{ (github.event_name == 'workflow_dispatch' && !inputs.latest) && 'false' || 'auto' }}

      # Same Dockerfile, args and cache as the real build, amd64 only, loaded
      # into the runner's Docker so Trivy can read it. No registry credentials yet.
      - name: Build amd64 for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: containeryard:scan
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.rev.outputs.epoch }}
            CREATED=${{ steps.rev.outputs.created }}
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
          pull: true
          cache-from: type=gha

      # Trivy runs from its official image pinned by digest (not trivy-action).
      # .trivyignore in the repo root is honoured because /src is the workdir.
      - name: Trivy report
        id: trivy
        env:
          TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          out="$RUNNER_TEMP/trivy"   # outside the build context
          mkdir -p "$out/cache"
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$PWD:/src" -w /src \
              -v "$out:/out" -v "$out/cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --quiet --scanners vuln "$@" containeryard:scan
          }
          trivy --format sarif --output /out/trivy.sarif
          trivy --severity CRITICAL,HIGH --ignore-unfixed --format json --output /out/fixable.json
          crit=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' "$out/fixable.json")
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' "$out/fixable.json")
          echo "critical=$crit" >>"$GITHUB_OUTPUT"
          {
            echo "### Trivy: ${{ needs.tag.outputs.tag }} (linux/amd64)"
            echo
            echo "Fixable: **$crit CRITICAL**, **$high HIGH**. All severities, fixed or not, are in the Security tab."
            if [ "$((crit + high))" -gt 0 ]; then
              echo
              echo "| Severity | Package | Installed | Fixed in | ID |"
              echo "|---|---|---|---|---|"
              jq -r '.Results[]? | .Vulnerabilities[]? | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion) | \(.VulnerabilityID) |"' "$out/fixable.json" | sort -u
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy results to the Security tab
        if: always() && steps.trivy.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/trivy/trivy.sarif
          category: trivy-image

      - name: Trivy gate (fixable CRITICAL)
        env:
          CRIT: ${{ steps.trivy.outputs.critical }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$CRIT" -eq 0 ]; then
            echo "no fixable CRITICAL findings"
          elif [ "$EVENT" = schedule ]; then
            echo "::warning::$CRIT fixable CRITICAL findings; weekly refresh publishes anyway, see the job summary"
          else
            echo "::error::$CRIT fixable CRITICAL findings; release blocked before Docker Hub. Fix them, or add a reasoned, expiring entry to .trivyignore"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
            SOURCE_DATE_EPOCH=${{ steps.rev.outputs.epoch }}
            CREATED=${{ steps.rev.outputs.created }}
          sbom: true
          provenance: mode=max
          # weekly refresh (and no_cache runs) rebuild every layer so apt-get upgrade runs again
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: 0xwulf/containeryard
          short-description: Self-hosted Docker observability dashboard with real-time logs, stack actions, and metrics
          readme-filepath: ./docker/README.md
